name: Java tekshiruvi (tez)

# Faqat Java/Kotlin kodini kompilyatsiya qiladi (native qismsiz) — xatolarni tez topish uchun.
# Natija ci-check branch'idagi log.txt ga yoziladi.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Kompilyatsiya
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json; fi
          set -o pipefail
          ./gradlew :TMessagesProj_App:compileAfatReleaseJavaWithJavac --continue -x lint 2>&1 | tee build.log

      - name: Logni saqlash
        if: always()
        run: |
          touch build.log
          mkdir -p /tmp/logs && cd /tmp/logs
          git init -q && git checkout -q -b ci-check
          { echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}"; grep -n -E "error:|FAILED|What went wrong|^e: " $GITHUB_WORKSPACE/build.log | head -400; echo ---; tail -120 $GITHUB_WORKSPACE/build.log; } > log.txt
          git add log.txt
          git -c user.name=ci -c user.email=ci@local commit -q -m "check ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-check
