name: Imzo kaliti parolini almashtirish

# Asosiy imzo kalitining (release.keystore) parolini yangisiga almashtiradi.
# Kalitning o'zi (imzo) o'zgarmaydi — foydalanuvchilar ilovani odatdagidek ustidan yangilay oladi.
#
# Tayyorgarlik (Settings → Secrets and variables → Actions → New repository secret):
#   NEW_KEYSTORE_PASSWORD  — yangi parol
#   GH_SECRETS_TOKEN       — GitHub token (fine-grained): shu repo uchun "Secrets: Read and write" ruxsati
# Keyin: Actions → "Imzo kaliti parolini almashtirish" → Run workflow.
# Workflow KEYSTORE_BASE64, KEYSTORE_PASSWORD va KEY_PASSWORD secret'larini o'zi yangilaydi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Parolni almashtirish
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          OLD_STORE: ${{ secrets.KEYSTORE_PASSWORD }}
          OLD_KEY: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          NEW_PASS: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$NEW_PASS" ]; then echo "::error::NEW_KEYSTORE_PASSWORD secret qo'yilmagan"; exit 1; fi
          if [ ${#NEW_PASS} -lt 6 ]; then echo "::error::Parol kamida 6 belgi bo'lishi kerak"; exit 1; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_SECRETS_TOKEN secret qo'yilmagan (secret'larni yangilash uchun kerak)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > ks
          TYPE=$(keytool -list -keystore ks -storepass "$OLD_STORE" 2>/dev/null | grep -i "Keystore type" | awk '{print $3}')
          echo "Kalit turi: $TYPE"
          # JKS: kalit paroli alohida; PKCS12: bitta parol
          keytool -keypasswd -alias "$ALIAS" -keystore ks -storepass "$OLD_STORE" -keypass "$OLD_KEY" -new "$NEW_PASS" 2>/dev/null || true
          keytool -storepasswd -keystore ks -storepass "$OLD_STORE" -new "$NEW_PASS"
          keytool -list -keystore ks -storepass "$NEW_PASS" > /dev/null
          # kalitning o'zi ham yangi parol bilan ochilishini tekshiramiz (imzolash uchun shart)
          keytool -importkeystore -noprompt -srckeystore ks -srcstorepass "$NEW_PASS" -srcalias "$ALIAS" -srckeypass "$NEW_PASS" \
            -destkeystore check.p12 -deststoretype pkcs12 -deststorepass "$NEW_PASS" -destkeypass "$NEW_PASS" > /dev/null
          rm -f check.p12
          echo "Yangi parol bilan kalit ochildi ✓"
          gh secret set KEYSTORE_BASE64 --repo "$REPO" --body "$(base64 -w0 ks)"
          gh secret set KEYSTORE_PASSWORD --repo "$REPO" --body "$NEW_PASS"
          gh secret set KEY_PASSWORD --repo "$REPO" --body "$NEW_PASS"
          rm -f ks
          echo "Secret'lar yangilandi. Endi NEW_KEYSTORE_PASSWORD va GH_SECRETS_TOKEN'ni o'chirib qo'yishingiz mumkin."
