name: MilliyGram Google Play (AAB)

# Google Play uchun imzolangan .aab faylini yig'adi. Faqat qo'lda ishga tushiriladi:
# Actions → "MilliyGram Google Play (AAB)" → Run workflow.
# Natija: Actions sahifasidagi artefakt (MilliyGram-play-<versiya>-<build>.aab) — uni Play Console'ga yuklaysiz.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Diskda joy ochish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Submodullarni yuklash
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK va CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Kalitlarni tayyorlash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          API_ID: ${{ secrets.API_ID }}
        run: |
          if [ -z "$API_ID" ]; then echo "::error::API_ID secret qo'yilmagan (my.telegram.org)"; exit 1; fi
          # Play uchun alohida "upload key" bo'lsa o'shani, bo'lmasa asosiy kalitni ishlatadi
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          else
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json; fi

      - name: Qo'shimcha swap
        run: |
          sudo fallocate -l 8G /swapfile_mg || sudo dd if=/dev/zero of=/swapfile_mg bs=1M count=8192
          sudo chmod 600 /swapfile_mg && sudo mkswap /swapfile_mg && sudo swapon /swapfile_mg || true
          free -h

      - name: AAB yig'ish
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STORE_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:bundleBundleAfatRelease --stacktrace \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS" 2>&1 | tee build.log

      - name: Faylni nomlash
        id: out
        run: |
          VER=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          AAB=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -1)
          NAME="MilliyGram-play-${VER}-${GITHUB_RUN_NUMBER}.aab"
          cp "$AAB" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.name }}
          retention-days: 30

      - name: Xato logi
        if: failure()
        run: grep -n -E "error:|FAILED|What went wrong" build.log | head -100 || true
